[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "proteinmod"
version = "0.1.0"
description = "Reproducible protein mutation-effect research benchmarks"
requires-python = ">=3.11,<3.15"
dependencies = ["numpy>=2.0,<3", "scipy>=1.14,<2", "scikit-learn>=1.5,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "biopython>=1.85,<2"]
structure = ["biopython>=1.85,<2", "matplotlib>=3.9,<4"]
m3 = ["biopython>=1.85,<2", "torch>=2.6,<3", "matplotlib>=3.9,<4"]
esm = ["torch>=2.6,<3", "transformers>=4.48,<5", "matplotlib>=3.9,<4"]

[project.scripts]
proteinmod = "proteinmod.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
