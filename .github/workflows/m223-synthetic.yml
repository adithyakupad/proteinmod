name: m223-synthetic
on: [push, pull_request]
jobs:
  synthetic-checkpoint-replay:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q tests/test_m223_checkpoint.py
      - run: python -O -m pytest -q tests/test_m223_checkpoint.py -k 'rejection or corrupted or changed_input or semantic or optimizer_reset'
      - run: python scripts/verify_m224.py
      - run: python scripts/run_m223.py --output runs/m223/ci --compare benchmarks/m223/results.json
