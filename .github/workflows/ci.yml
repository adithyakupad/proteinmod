name: checks
on: [push, pull_request]
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest
  m3-neural-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev,m3]'
      - run: pytest tests/test_structural_graph.py tests/test_structural_gnn.py tests/test_structural_experiments.py tests/test_multiprotein.py tests/test_multiprotein_gnn.py tests/test_hybrid.py tests/test_hybrid_experiments.py tests/test_residue_cache.py tests/test_stability_data.py tests/test_stability_model.py tests/test_multitask.py tests/test_conditioning.py tests/test_assay_metadata.py tests/test_reliability.py tests/test_epistasis.py tests/test_family_data.py tests/test_family_neural.py tests/test_uncertainty.py tests/test_uncertainty_neural.py tests/test_edge_chemistry.py tests/test_edge_neural.py
