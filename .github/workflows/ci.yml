name: checks
on: [push, pull_request]
jobs:
  historical-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/audit_m16.py
      - run: python scripts/verify_m18.py
      - run: python scripts/verify_m181.py
      - run: python scripts/verify_m182.py
      - run: python scripts/verify_m183.py
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - run: python scripts/verify_m16_1.py
        if: matrix.python == '3.12'
      - run: python scripts/verify_m17.py
        if: matrix.python == '3.12'
  m3-neural-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev,m3,esm]'
      - run: pytest
